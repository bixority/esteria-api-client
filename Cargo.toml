[package]
name = "esteria-api-client"
version = "0.0.23"
rust-version = "1.99"
edition = "2024"
description = "A Rust-based client library for sending SMS messages via the Esteria API"
license = "GPL-3.0-only"

[dependencies]
bitflags = "2.13.2"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"], optional = true }
env_logger = "0.11.11"
log = "0.4.34"
pyo3 = { version = "0.29.3", features = ["extension-module"], optional = true }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"], optional = true }
reqwest = { version = "0.13.5", features = ["json", "query"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }

[lib]
name = "esteria_api_client"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "esteria-api-client"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = []
python = ["pyo3", "pyo3-async-runtimes"]
cli = ["clap"]

[dev-dependencies]
httpmock = "0.8.3"


[profile.dev]
debug = true
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.release.package."*"]
codegen-units = 1
debug = false
opt-level = 3
strip = true
